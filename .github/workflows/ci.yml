name: ci

# Check every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # These binaries ship to musl and bionic as well as glibc. A dynamically linked
  # build fails there with ENOENT for a file that exists — the ELF interpreter is
  # what is missing.
  CGO_ENABLED: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pkg/webui/webui.go has `//go:embed all:dist`, and dist/ is not committed.
      # Every go command fails until the SPA exists:
      #   pattern all:dist: no matching files found
      # build.sh already documents the exact recipe, so use it rather than a
      # second copy that can drift.
      - name: build the SPA into the embed path
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            https://github.com/easydev-org/easysh-webui.git /tmp/webui
          cd /tmp/webui
          npm ci --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/pkg/webui/dist"
          OUT_DIR="$GITHUB_WORKSPACE/pkg/webui/dist" npm run build
          echo "SPA files: $(find "$GITHUB_WORKSPACE/pkg/webui/dist" -type f | wc -l)"

      - run: go vet ./...

      - run: go test ./...

      - run: go build ./...

      - name: assert the binaries are static
        run: |
          set -euo pipefail
          for cmd in easysh easyshd; do
            go build -ldflags "-s -w" -o "/tmp/$cmd" "./cmd/$cmd"
            if readelf -l "/tmp/$cmd" | grep -q INTERP; then
              echo "::error::$cmd is dynamically linked"
              exit 1
            fi
          done
          echo "static: OK"
